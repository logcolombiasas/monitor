name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller --noconfirm monitor.spec
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/LogcolombiaMonitor -DestinationPath LogcolombiaMonitor-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LogcolombiaMonitor-windows
          path: LogcolombiaMonitor-windows.zip
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LogcolombiaMonitor-windows.zip
